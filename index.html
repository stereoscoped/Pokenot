<!DOCTYPE html>
<html>

<head>
    <title>proj3 - pokenot</title>

    <style>
        #gameBox {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 800px;
            height: 600px;
            z-index: 1;
            border: 4px solid red;
            box-sizing: border-box;
        }

        .pokemon {
            position: absolute;
            z-index: 2;
            image-rendering: pixelated;
            pointer-events: none;
            transform: translate(-50%, -100%);
        }

        /* back sprite */
        #mypokemon {
            left: 230px;
            top: 350px;
            width: 220px;
            height: auto;
        }

        /* front sprite */
        #encounterpokemon {
            left: 620px;
            top: 250px;
            width: 150px;
            height: auto;
        }
    </style>
</head>

<body>
<div id="gameBox">
    <canvas id="canvas" width="800" height="600"></canvas>
    <img class = "pokemon" id="mypokemon" src="assets/pokemon_back_sprites/charizard.gif">
    <img class = "pokemon"id="encounterpokemon" src="assets/pokemon_front_sprites/charizard.gif">

</div>

    <!-- load first -->
    <script src="js/assets.js"></script>

    <script src="js/maps.js"></script>
    <script src="js/input.js"></script>
    <script src="js/pokemon.js"></script>
    <script src="js/player.js"></script>
    <script src="js/collisions.js"></script>
    <script src="js/overworld.js"></script>
    <script src="js/battle_start.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/game.js"></script>
    <script src="js/start.js"></script>

<!-- load last -->
    <script src="js/main.js"></script>

</body>

</html>
